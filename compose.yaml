name: careloop-research
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CARELOOP_ENVIRONMENT: development
      CARELOOP_ENABLE_LOCAL_SYNTHETIC_IDENTITY: "true"
      CARELOOP_DATABASE_URL: postgresql+psycopg://careloop:careloop@postgres:5432/careloop
      CARELOOP_REDIS_URL: redis://redis:6379/0
      CARELOOP_WEB_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 8
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["uv", "run", "--locked", "arq", "careloop.web_api.worker.WorkerSettings"]
    environment:
      CARELOOP_ENVIRONMENT: development
      CARELOOP_DATABASE_URL: postgresql+psycopg://careloop:careloop@postgres:5432/careloop
      CARELOOP_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "arq", "--check", "careloop.web_api.worker.WorkerSettings"]
      interval: 10s
      timeout: 3s
      retries: 8
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/en/participant').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 8
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: careloop
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop
    volumes: ["careloop-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careloop -d careloop"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:8.2.1-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  careloop-data:
