name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Synchronize locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy src
      - name: Test
        run: uv run --locked pytest -q
      - name: Rebuild benchmark evidence and summaries
        run: uv run --locked careloop benchmark --manifest benchmarks/manifest.v1.json
      - name: Verify generated artifacts are unchanged
        run: git diff --exit-code -- artifacts/raw artifacts/summary
